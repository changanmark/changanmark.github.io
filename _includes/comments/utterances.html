<!-- Load comments only when the reader approaches the bottom of the article. -->
<div id="utterances-lazy-anchor" aria-hidden="true"></div>
<script>
  (() => {
    const anchor = document.getElementById('utterances-lazy-anchor');
    let loaded = false;

    const loadComments = () => {
      if (loaded) return;
      loaded = true;

      const origin = 'https://utteranc.es';
      const themeMapper = Theme.getThemeMapper('github-light', 'github-dark');
      const script = document.createElement('script');

      script.src = `${origin}/client.js`;
      script.setAttribute('repo', '{{ site.comments.utterances.repo }}');
      script.setAttribute('issue-term', '{{ site.comments.utterances.issue_term }}');
      script.setAttribute('theme', themeMapper[Theme.visualState]);
      script.crossOrigin = 'anonymous';
      script.async = true;

      document.querySelector('footer').insertAdjacentElement('beforebegin', script);

      addEventListener('message', (event) => {
        if (event.source !== window || !event.data || event.data.id !== Theme.ID) return;

        const utterances = document.querySelector('.utterances-frame');
        if (!utterances) return;

        utterances.contentWindow.postMessage(
          { type: 'set-theme', theme: themeMapper[Theme.visualState] },
          origin
        );
      });
    };

    if (!('IntersectionObserver' in window)) {
      loadComments();
      return;
    }

    const observer = new IntersectionObserver(
      (entries) => {
        if (!entries.some((entry) => entry.isIntersecting)) return;
        observer.disconnect();
        loadComments();
      },
      { rootMargin: '600px 0px' }
    );

    observer.observe(anchor);
  })();
</script>

<!-- Kept for compatibility with Chirpy's PWA script, but updates are automatic. -->
<aside
  id="notification"
  class="toast d-none"
  role="status"
  aria-live="polite"
  aria-atomic="true"
  data-bs-animation="false"
  data-bs-autohide="true"
>
  <div class="toast-body">
    <button type="button" aria-label="Update"></button>
  </div>
</aside>
